<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="35%" stop-color="#c29b40"/>
      <stop offset="70%" stop-color="#e0b853"/>
      <stop offset="100%" stop-color="#8a6920"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Elegant Border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8"/>
  <rect x="28" y="28" width="456" height="456" rx="76" fill="none" stroke="#c29b40" stroke-width="2" opacity="0.3"/>
  <!-- Central AP Monogram -->
  <g id="ap-monogram" filter="url(#glow)">
    <text x="256" y="325" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="220" 
          font-weight="900" 
          letter-spacing="4"
          fill="url(#goldGrad)" 
          text-anchor="middle">AP</text>
  </g>
  <!-- Small Star Sparkle -->
  <path d="M 370 140 Q 370 165 395 165 Q 370 165 370 190 Q 370 165 345 165 Q 370 165 370 140 Z" fill="#f5e1a4" opacity="0.9"/>
  <!-- Studio Subtext Accent -->
  <text x="256" y="390" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="8"
        fill="#a8a29e" 
        text-anchor="middle">ARABIPROMPT</text>
</svg>

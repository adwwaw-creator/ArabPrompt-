    <title>ArabPrompt | عرب برومبت - المنصة الاحترافية المدفوعة بالكامل</title>
    <!-- Suppress benign Vite HMR WebSocket errors in iframe environment and clean dev caches -->
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('WebSocket') || args[0].includes('@vite/client'))) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };

        // If in development or preview, ensure old service workers and chunk caches do not corrupt React modules
        if (typeof window !== 'undefined' && 'serviceWorker' in navigator && window.location.hostname.includes('ais-dev')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        }
      })();
    </script>
